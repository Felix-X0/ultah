<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surprise For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            background-color: #050510; /* Warna gelap malam */
            color: white; 
            font-family: 'Poppins', sans-serif; 
            overflow: hidden; 
            width: 100vw;
            height: 100vh;
        }

        /* --- KANVAS KEMBANG API --- */
        #fireworks-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1; /* Di belakang konten */
        }

        /* --- KONTEN PESAN NEON --- */
        #content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Agar klik tembus ke tombol */
        }

        .neon-box {
            position: absolute;
            display: flex;
            align-items: center;
            background: rgba(20, 0, 20, 0.6);
            border: 2px solid #ff2a85;
            border-radius: 50px;
            padding: 8px 20px;
            box-shadow: 0 0 15px #ff2a85, inset 0 0 10px #ff2a85;
            animation: float-anim 4s infinite ease-in-out alternate;
            pointer-events: auto;
        }

        .neon-box img {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 15px;
            border: 1px solid #ff2a85;
            box-shadow: 0 0 10px #ff2a85;
        }

        .neon-box span {
            font-family: 'Dancing Script', cursive;
            font-size: 1.3em;
            color: #ffd1dc;
            text-shadow: 0 0 5px #ff2a85;
        }

        /* Animasi Mengambang */
        @keyframes float-anim {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-15px) scale(1.02); }
        }

        /* Posisi Box (Bisa kamu atur ulang posisinya dengan mengubah persentase) */
        .box1 { top: 20%; left: 10%; animation-delay: 0s; }
        .box2 { top: 40%; right: 10%; animation-delay: 1s; }
        .box3 { top: 60%; left: 5%; animation-delay: 2s; }
        .box4 { top: 75%; right: 15%; animation-delay: 0.5s; }

        /* --- TOMBOL CLOSE --- */
        #close-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 30px;
            font-size: 1em;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #fff;
            background: transparent;
            border: 2px solid #ff2a85;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff2a85, inset 0 0 8px #ff2a85;
            z-index: 20;
            pointer-events: auto;
            transition: all 0.3s ease;
        }

        #close-btn:hover {
            background: #ff2a85;
            box-shadow: 0 0 25px #ff2a85;
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>

    <div id="content-layer">
        
        <div class="neon-box box1">
            <img src="foto1.jpg" alt="Foto">
            <span>Happy birthday sayang... You mean everything ✨</span>
        </div>

        <div class="neon-box box2">
            <span>Memilikimu setiap hari adalah kado terindah ❤️</span>
        </div>

        <div class="neon-box box3">
            <img src="foto2.jpg" alt="Foto">
            <span>Waktu berlalu, tapi rasa ini tetap sama. Always.</span>
        </div>

        <div class="neon-box box4">
            <span>My love... masih sama, selalu sama. 💕</span>
        </div>

        <button id="close-btn">CLOSE</button>
    </div>

    <audio id="music" src="musik.mp3" autoplay loop></audio>

    <script>
        // --- LOGIKA KEMBANG API (FIREWORKS) DENGAN CANVAS ---
        const canvas = document.getElementById("fireworks-canvas");
        const ctx = canvas.getContext("2d");
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2 + 1;
                this.velocity = {
                    x: (Math.random() - 0.5) * 8,
                    y: (Math.random() - 0.5) * 8
                };
                this.friction = 0.98;
                this.gravity = 0.05;
                this.opacity = 1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.opacity -= 0.015;
            }
        }

        let particles = [];
        const colors = ['#ff2a85', '#ff7eb3', '#8a2be2', '#00e5ff', '#ffffff'];

        function createFirework(x, y) {
            const particleCount = 100;
            const color = colors[Math.floor(Math.random() * colors.length)];
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.fillStyle = "rgba(5, 5, 16, 0.2)"; // Efek jejak kembang api
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach((particle, index) => {
                if (particle.opacity <= 0) {
                    particles.splice(index, 1);
                } else {
                    particle.update();
                    particle.draw();
                }
            });
        }

        // Tembakkan kembang api secara acak setiap beberapa detik
        setInterval(() => {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height / 2); // Meledak di bagian atas layar
            createFirework(x, y);
        }, 800);

        // Kembang api di posisi klik (interaktif)
        canvas.addEventListener("click", (e) => {
            createFirework(e.clientX, e.clientY);
        });

        animateFireworks();

        // --- TOMBOL CLOSE (Opsional) ---
        document.getElementById('close-btn').addEventListener('click', () => {
            alert("Tombol close ditekan. Kamu bisa menambahkan aksi lain di sini!");
            // Misalnya: window.close(); atau mengarahkan ke halaman lain
        });
    </script>
</body>
</html>
