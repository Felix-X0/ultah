<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Special Birthday Gift</title>
    <style>
        body { 
            margin: 0; background: black; color: white; font-family: 'Georgia', serif; 
            text-align: center; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; 
        }
        #matrix { position: fixed; top: 0; left: 0; z-index: 0; width: 100%; height: 100%; }
        
        #countdown { position: absolute; font-size: 8em; color: white; z-index: 2; text-shadow: 0 0 30px white; }
        
        #content { 
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            width: 100%; height: 100%; position: relative; z-index: 1; 
        }

        /* TULISAN CINEMATIC */
        .big-running-text {
            font-size: 3.5em;
            font-weight: 900;
            color: white;
            text-shadow: 0 0 10px white, 0 0 20px #ff00ff, 0 0 30px #ff00ff;
            text-transform: uppercase;
            letter-spacing: 5px;
            position: absolute;
            top: 10%;
            width: 100%;
            z-index: 5;
            animation: fadeIn 2s ease-in-out;
        }

        /* ALBUM BUKU */
        .album-book { 
            width: 320px; height: 420px; position: relative; perspective: 1500px; 
            margin-top: 120px; z-index: 10; cursor: pointer;
        }
        
        .cover {
            position: absolute; width: 100%; height: 100%; background: linear-gradient(145deg, #222, #000);
            border: 3px solid white; border-radius: 5px 20px 20px 5px; transform-origin: left;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 1.5s; 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: 10px 10px 30px rgba(255,255,255,0.3); backface-visibility: hidden;
        }
        .cover.open { transform: rotateY(-140deg); opacity: 0; pointer-events: none; }
        
        .inside {
            position: absolute; width: 100%; height: 100%; background: #111; border: 3px solid white;
            border-radius: 5px 20px 20px 5px; padding: 15px; box-sizing: border-box;
            display: flex; justify-content: center; align-items: center;
        }
        .inside img { width: 100%; height: 100%; object-fit: contain; border-radius: 10px; animation: fadeIn 0.8s forwards; }
        
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div id="countdown">5</div>
    
    <div id="content">
        <marquee direction="left" scrollamount="8" class="big-running-text">
            HAPPY BIRTHDAY SAYANG ✨ I LOVE YOU SO MUCH! SEMOGA PANJANG UMUR DAN BAHAGIA SELALU 🤍🎂
        </marquee>
        
        <div class="album-book" id="albumBtn">
            <div class="cover" id="albumCover">
                <h2>📖 Buka Album</h2>
                <p style="font-size: 1em; margin-top: 10px;">(Tap / Sentuh layarnya)</p>
            </div>
            <div class="inside" id="insideAlbum">
                <img id="albumPhoto" src="" style="display: none;">
            </div>
        </div>
    </div>

    <audio id="music" loop src="musik.mp3"></audio>

    <script>
        let count = 5;
        let timer = setInterval(() => {
            count--;
            if (count > 0) document.getElementById('countdown').innerText = count;
            else { 
                clearInterval(timer); 
                document.getElementById('countdown').style.display = 'none'; 
                document.getElementById('content').style.display = 'flex'; 
            }
        }, 1200); 

        let photos = ["foto1.jpg", "foto2.jpg", "foto3.jpg", "foto4.jpg"];
        let currentPhotoIndex = 0;
        let isCoverOpen = false;

        document.getElementById('albumBtn').addEventListener('click', function() {
            let audio = document.getElementById('music');
            if (audio.paused) audio.play();

            if (!isCoverOpen) {
                document.getElementById('albumCover').classList.add('open');
                document.getElementById('albumPhoto').style.display = 'block';
                document.getElementById('albumPhoto').src = photos[currentPhotoIndex];
                isCoverOpen = true;
            } else {
                currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
                let imgEl = document.getElementById('albumPhoto');
                imgEl.style.animation = 'none';
                setTimeout(() => {
                    imgEl.src = photos[currentPhotoIndex];
                    imgEl.style.animation = 'fadeIn 0.8s forwards';
                }, 50);
            }
        });

        const c = document.getElementById('matrix'), ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const drops = Array(Math.floor(c.width/20)).fill(1);
        function draw() { 
            ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0, c.width, c.height); 
            ctx.fillStyle = '#888'; 
            drops.forEach((y, i) => { ctx.fillText("♥", i*20, y*20); if(y*20 > c.height) drops[i]=0; else drops[i]++; }); 
        }
        setInterval(draw, 50);
    </script>
</body>
</html>
