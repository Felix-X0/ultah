<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Surprise!</title>
    <style>
        body { margin: 0; background: black; color: #0F0; font-family: monospace; overflow: hidden; text-align: center; }
        #matrix { position: fixed; top: 0; left: 0; }
        #content { position: relative; z-index: 1; margin-top: 20vh; display: none; }
        .slant { font-style: italic; transform: rotate(-8deg); font-size: 2.5em; color: white; text-shadow: 2px 2px 10px red; }
        .foto { width: 280px; border: 5px solid white; border-radius: 20px; margin: 20px; }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div id="content">
        <h1 class="slant">Happy Anniversary Sayang!</h1>
        <img src="PASTE_LINK_FOTO_DI_SINI" class="foto">
        <p style="color:white; font-size: 1.2em;">Terima kasih untuk segalanya.</p>
        </div>

    <script>
        const c = document.getElementById('matrix'), ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        const drops = Array(Math.floor(c.width/20)).fill(1);
        function draw() {
            ctx.fillStyle = 'rgba(0,0,0,0.05)'; ctx.fillRect(0,0, c.width, c.height);
            ctx.fillStyle = '#0F0';
            drops.forEach((y, i) => { ctx.fillText("♥", i*20, y*20); if(y*20 > c.height) drops[i]=0; else drops[i]++; });
        }
        setInterval(draw, 50);
        setTimeout(() => { document.getElementById('content').style.display = 'block'; }, 4000);
    </script>
</body>
</html>
