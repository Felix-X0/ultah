<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Birthday Gift</title>
    <style>
        body { 
            margin: 0; background: black; color: white; font-family: 'Georgia', serif; 
            text-align: center; overflow: hidden; height: 100vh; display: flex; 
            flex-direction: column; align-items: center; justify-content: center;
        }
        #matrix { position: fixed; top: 0; left: 0; z-index: 0; width: 100%; height: 100%; }
        
        #countdown { 
            position: absolute; font-size: 10em; font-weight: bold; color: white; 
            z-index: 2; text-shadow: 0 0 30px white; 
        }
        
        #content { 
            display: none; z-index: 1; width: 95%; max-width: 600px; 
            animation: fadeIn 1s ease-in;
        }

        .big-running-text {
            font-size: 2.2em; font-weight: 900; color: white; 
            text-shadow: 0 0 10px white, 0 0 20px #ff00ff;
            text-transform: uppercase; margin-bottom: 25px;
        }

        .grid-container { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; 
        }
        
        .foto-box { 
            width: 100%; height: 220px; border: 3px solid white; 
            border-radius: 15px; overflow: hidden; 
        }
        
        .foto-box img { 
            width: 100%; height: 100%; object-fit: cover; 
            animation: popUp 0.8s ease-out forwards; 
        }

        @keyframes popUp { 
            from { transform: scale(0.5); opacity: 0; } 
            to { transform: scale(1); opacity: 1; } 
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <canvas id="matrix"></canvas>
    <div id="countdown">5</div>
    
    <div id="content">
        <marquee class="big-running-text">
            HAPPY BIRTHDAY SAYANG ✨ I LOVE YOU! SEMOGA PANJANG UMUR DAN BAHAGIA SELALU 🤍🎂
        </marquee>
        
        <div class="grid-container">
            <div class="foto-box"><img src="foto1.jpg"></div>
            <div class="foto-box"><img src="foto2.jpg"></div>
            <div class="foto-box"><img src="foto3.jpg"></div>
            <div class="foto-box"><img src="foto4.jpg"></div>
        </div>
        <p style="margin-top:20px; font-size: 1.1em; color: #ccc;">(Tap layar untuk musik)</p>
    </div>

    <audio id="music" loop src="musik.mp3"></audio>

    <script>
        // Hitung Mundur
        let count = 5;
        let timer = setInterval(() => {
            count--;
            if (count > 0) document.getElementById('countdown').innerText = count;
            else { 
                clearInterval(timer); 
                document.getElementById('countdown').style.display = 'none'; 
                document.getElementById('content').style.display = 'block'; 
            }
        }, 1200);

        // Musik Play
        window.onclick = () => { document.getElementById('music').play(); };

        // Hujan Hati Lembut
        const c = document.getElementById('matrix'), ctx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        let drops = Array(15).fill(0).map(() => Math.random() * c.height);
        function draw() { 
            ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.fillRect(0,0, c.width, c.height); 
            ctx.fillStyle = '#ff69b4'; ctx.font = "25px Arial";
            drops.forEach((y, i) => { 
                ctx.fillText("♥", i*(c.width/15), y); 
                drops[i] = y > c.height ? 0 : y + 1.5; 
            }); 
        }
        setInterval(draw, 50);
    </script>
</body>
</html>
