<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body { 
            margin: 0; 
            /* Latar belakang gelap agar hujan hati terlihat jelas */
            background: linear-gradient(135deg, #0b0710, #1f183d, #141424); 
            color: white; 
            font-family: 'Poppins', sans-serif; 
            overflow: hidden; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-direction: column;
        }

        /* --- EFEK HUJAN HATI --- */
        #heart-rain {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none; /* Agar hujan hati tidak bisa di-klik/mengganggu tombol */
            z-index: 1; /* Posisi di paling belakang */
            overflow: hidden;
        }
        .falling-heart {
            position: absolute;
            top: -10vh;
            color: #ff477e;
            animation: fall linear forwards;
            opacity: 0;
        }
        @keyframes fall {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(110vh); opacity: 0; }
        }
        /* ------------------------ */

        /* Elemen Utama (berada di atas hujan) */
        .content-wrapper {
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        /* Tombol Mulai */
        #start-btn {
            padding: 15px 35px;
            font-size: 1.2em;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: #fff;
            background: #ff477e;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(255, 71, 126, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        #start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 71, 126, 0.7);
        }

        /* Hitung Mundur & Ucapan */
        #central-display { 
            font-size: 4.5em; 
            font-weight: 700; 
            text-align: center; 
            position: absolute;
            transition: opacity 1s, transform 0.3s; 
            display: none; 
        }
        
        .word { 
            display: inline-block; 
            margin: 0 10px; 
            opacity: 0;
            font-family: 'Dancing Script', cursive; 
            color: #ff9a9e;
            text-shadow: 0 0 15px rgba(255, 154, 158, 0.8);
            animation: popUp 0.7s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards; 
        }
        @keyframes popUp { 
            0% { transform: scale(0) translateY(20px); opacity: 0; } 
            100% { transform: scale(1) translateY(0); opacity: 1; } 
        }

        /* Orbit Foto */
        #orbit-container { 
            display: none; 
            position: relative; 
            width: 300px; 
            height: 300px; 
            animation: rotate 20s linear infinite; 
            opacity: 0;
            transition: opacity 2s ease-in;
        }
        
        .center-heart {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 50px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .photo-item {
            position: absolute; 
            width: 100px; 
            height: 100px;
            background-size: cover; 
            background-position: center;
            border: 3px solid #ff477e;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 71, 126, 0.6);
            animation: counter-rotate 20s linear infinite;
        }
        
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes counter-rotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        /* Posisi Foto */
        .p1 { top: -50px; left: 100px; background-image: url('foto1.jpg'); }
        .p2 { top: 100px; left: 250px; background-image: url('foto2.jpg'); }
        .p3 { top: 250px; left: 100px; background-image: url('foto3.jpg'); }
        .p4 { top: 100px; left: -50px; background-image: url('foto4.jpg'); }
    </style>
</head>
<body>

    <div id="heart-rain"></div>

    <div class="content-wrapper">
        <button id="start-btn">Buka Kejutan 🎁</button>
        
        <div id="central-display">5</div>
        
        <div id="orbit-container">
            <div class="center-heart">❤️</div>
            <div class="photo-item p1"></div>
            <div class="photo-item p2"></div>
            <div class="photo-item p3"></div>
            <div class="photo-item p4"></div>
        </div>
    </div>

    <audio id="music" src="musik.mp3"></audio>

    <script>
        // --- LOGIKA HUJAN HATI ---
        const heartContainer = document.getElementById('heart-rain');
        const heartIcons = ['❤️', '💖', '💕', '💗']; // Variasi bentuk hati

        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            
            // Pilih ikon hati secara acak
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            
            // Pengaturan posisi, ukuran, dan kecepatan secara acak (Lambat / Slow)
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 5 + 6 + 's'; // Waktu jatuh 6 - 11 detik (Sangat lambat)
            heart.style.fontSize = Math.random() * 15 + 10 + 'px'; // Ukuran 10px - 25px
            
            // Sedikit efek buram (blur) acak untuk kedalaman
            const isBlurred = Math.random() > 0.5;
            if(isBlurred) heart.style.filter = `blur(${Math.random() * 2}px)`;

            heartContainer.appendChild(heart);

            // Hapus elemen setelah selesai turun agar web tidak lag
            setTimeout(() => {
                heart.remove();
            }, 12000); 
        }

        // Munculkan hati setiap 300 milidetik
        setInterval(createHeart, 300);
        // -------------------------

        // --- LOGIKA KEJUTAN (SAMA SEPERTI SEBELUMNYA) ---
        const startBtn = document.getElementById('start-btn');
        const display = document.getElementById('central-display');
        const orbit = document.getElementById('orbit-container');
        const audio = document.getElementById('music');
        let count = 5;

        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            display.style.display = 'block';

            let timer = setInterval(() => {
                count--;
                if (count > 0) {
                    display.style.transform = 'scale(0.8)';
                    setTimeout(() => {
                        display.innerText = count;
                        display.style.transform = 'scale(1)';
                    }, 100);
                } else {
                    clearInterval(timer);
                    startGreeting();
                }
            }, 1000);
        });

        function startGreeting() {
            display.innerText = "";
            const text = "HAPPY BIRTHDAY SAYANG!".split(" ");
            text.forEach((word, i) => {
                setTimeout(() => {
                    let span = document.createElement("span");
                    span.className = "word";
                    span.innerText = word;
                    display.appendChild(span);
                }, i * 600);
            });

            setTimeout(() => {
                display.style.opacity = '0';
                
                setTimeout(() => {
                    display.style.display = 'none';
                    orbit.style.display = 'block';
                    
                    setTimeout(() => { orbit.style.opacity = '1'; }, 50);
                    
                    audio.play().catch(error => {
                        console.log("Audio gagal diputar:", error);
                    });
                }, 1000);
            }, text.length * 600 + 1500);
        }
    </script>
</body>
</html>
