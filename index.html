<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: radial-gradient(circle, #1a0620, #000); color: white; font-family: 'Poppins', sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }
        
        /* Hitung Mundur & Ucapan */
        #central-display { font-size: 3em; font-weight: 800; text-align: center; z-index: 10; transition: opacity 1s; }
        .word { display: inline-block; margin: 0 5px; animation: pop 0.5s ease; }
        @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }

        /* Orbit Foto */
        #orbit-container { display: none; position: relative; width: 300px; height: 300px; animation: rotate 20s linear infinite; }
        .photo-item {
            position: absolute; width: 100px; height: 100px;
            background-size: cover; background-position: center;
            border: 4px solid #ff69b4;
            /* Bentuk Hati */
            clip-path: path('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
            animation: counter-rotate 20s linear infinite;
        }
        
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes counter-rotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        /* Posisi Foto */
        .p1 { top: -50px; left: 100px; }
        .p2 { top: 100px; left: 250px; }
        .p3 { top: 250px; left: 100px; }
        .p4 { top: 100px; left: -50px; }
    </style>
</head>
<body>

    <div id="central-display">5</div>
    
    <div id="orbit-container">
        <div class="photo-item p1" style="background-image: url('foto1.jpg');"></div>
        <div class="photo-item p2" style="background-image: url('foto2.jpg');"></div>
        <div class="photo-item p3" style="background-image: url('foto3.jpg');"></div>
        <div class="photo-item p4" style="background-image: url('foto4.jpg');"></div>
    </div>

    <audio id="music" src="musik.mp3"></audio>

    <script>
        const display = document.getElementById('central-display');
        const orbit = document.getElementById('orbit-container');
        const audio = document.getElementById('music');
        let count = 5;

        // 1. Hitung Mundur
        let timer = setInterval(() => {
            count--;
            if (count > 0) {
                display.innerText = count;
            } else {
                clearInterval(timer);
                startGreeting();
            }
        }, 1000);

        // 2. Animasi Ucapan
        function startGreeting() {
            display.innerText = "";
            const text = "HAPPY BIRTHDAY SAYANG!".split(" ");
            text.forEach((word, i) => {
                setTimeout(() => {
                    let span = document.createElement("span");
                    span.className = "word";
                    span.innerText = word;
                    display.appendChild(span);
                }, i * 500);
            });

            // 3. Hilangkan ucapan dan munculkan album
            setTimeout(() => {
                display.style.opacity = '0';
                setTimeout(() => {
                    display.style.display = 'none';
                    orbit.style.display = 'block';
                    audio.play(); // Musik mulai saat album muncul
                }, 1000);
            }, text.length * 500 + 1000);
        }
    </script>
</body>
</html>
